<!DOCTYPE html>
<html>
<head>
    <title>AI Server Health Monitor</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            height: 100vh;
            background: linear-gradient(-45deg, #0f2027, #203a43, #2c5364, #121212);
            background-size: 400% 400%;
            animation: gradientMove 12s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            width: 90%;
            max-width: 900px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
        }

        h1 {
            text-align: center;
            margin-bottom: 15px;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            font-size: 14px;
            margin-bottom: 25px;
            color: #ccc;
        }

        textarea {
            width: 100%;
            height: 180px;
            padding: 15px;
            border-radius: 15px;
            border: none;
            outline: none;
            font-size: 14px;
            resize: none;
            background: rgba(0,0,0,0.6);
            color: white;
        }

        textarea::placeholder {
            color: #aaa;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            border-radius: 15px;
            border: none;
            background: linear-gradient(90deg, #00ffcc, #0072ff);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            box-shadow: 0 0 15px #00ffcc;
        }

        .results {
            margin-top: 30px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }

        .card {
            background: rgba(0,0,0,0.5);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
        }

        .card h3 {
            font-size: 14px;
            margin-bottom: 8px;
            color: #bbb;
        }

        .card p {
            font-size: 20px;
            font-weight: bold;
        }

        .status-good {
            color: #00ff88;
        }

        .status-bad {
            color: #ff4c4c;
        }

        footer {
            margin-top: 25px;
            text-align: center;
            font-size: 12px;
            color: #aaa;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>AI Server Health Monitor</h1>

    <div class="subtitle">
        AI-Based Server Health Monitoring & Failure Prediction System
    </div>

    <textarea id="serverLogs" placeholder="Paste server logs here...

Example:
ERROR: Disk failure
WARNING: CPU usage 95%
INFO: Service restarted
CRITICAL: Memory overflow"></textarea>

    <button onclick="analyzeServer()">Analyze Server Health</button>

    <div id="result" class="results"></div>

    <footer>
        AI Engine • Predictive Analytics • Cloud Ready
    </footer>

</div>

<script src="script.js"></script>

</body>
</html>
